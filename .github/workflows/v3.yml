name: BM v3

on:
  push:
    branches: [v3]
  pull_request:
    branches: [v3]

jobs:
  servidor:
    runs-on: windows-latest  # el servidor del hotel es Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s bm/tests -t .

  interfaz:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build  # comprueba tipos y compila
